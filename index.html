<title>Lifeline Fitness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: one column on phones; cards flow to 2-3 columns on wide screens. A hazard-tape stripe sits under the wordmark. */
  --bg:#0A0A09;
  --panel:#141412;
  --panel-2:#1C1C19;
  --line:#2D2D27;
  --text:#F3F0E2;
  --muted:#A39F8C;
  --yellow:#FFD400;
  --yellow-ink:#171300;
  --yellow-soft:rgba(255,212,0,.14);
  --bad:#FF6A55;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;margin:0;font-weight:800;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 20px}
.top h1{font-size:clamp(40px,9vw,64px);line-height:.9;color:var(--yellow);letter-spacing:.02em}
.top .sub{color:var(--muted);font-size:13px;margin-top:6px}
.clock{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--f-mono);font-size:12px;color:var(--muted);gap:2px}
.clock b{font-weight:500;color:var(--text);font-size:18px}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,var(--bg) 10px 20px);margin-top:-6px}


.brand{display:flex;align-items:center;gap:14px}
.brand .logo{width:clamp(56px,14vw,84px);height:auto;aspect-ratio:1;border-radius:10px;border:2px solid var(--yellow);flex:none;display:block}
/* nav */

<script>
(function(){
'use strict';
/* ---------- constants & helpers ---------- */
var GOAL_WATER=5000, GOAL_STEPS=11000;
var DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
var EXLIST=['Bench press','Squat','Deadlift','Overhead press','Barbell row','Pull-up','Lat pulldown','Leg press','Bicep curl','Tricep pushdown','Plank','Treadmill'];
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function mondayOf(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function hm(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function dowIdx(s){return (parse(s).getDay()+6)%7}
function fmtShort(s){var d=parse(s);return d.getDate()+' '+MON[d.getMonth()]}
function fmtLong(s){var d=parse(s);return DOW[dowIdx(s)]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function fmtStamp(iso){if(!iso)return '';var d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())+' on '+d.getDate()+' '+MON[d.getMonth()]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function eq(a,b){
  if(a===b)return true;
  if(typeof a!=='object'||typeof b!=='object'||!a||!b)return false;
  var ka=Object.keys(a),kb=Object.keys(b);
  if(ka.length!==kb.length)return false;
  for(var i=0;i<ka.length;i++){if(!eq(a[ka[i]],b[ka[i]]))return false}
  return true;
}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function trim2(n){return n.toFixed(2).replace(/\.?0+$/,'')}

/* ---------- data model ---------- */
function blankEx(){return {n:'',s:'',r:'',w:'',min:'',sec:'',d:false}}
function blankDay(date){
  var ex=[];for(var i=0;i<10;i++)ex.push(blankEx());
  return {date:date,healthy:null,fast:null,ex:ex,weight:'',water:0,steps:'',mt:0,gt:0,cm:0,cb:0,customFoods:[],customDrinks:[],meals:{breakfast:[],lunch:[],snacks:[],dinner:[]},note:'',times:{},updatedAt:''};
}
function normDay(x){
  var b=blankDay(x.date||''),d={};
  Object.keys(b).forEach(function(k){d[k]=x[k]!==undefined?x[k]:b[k]});
  if(x.sample)d.sample=true;
  d.ex=Array.isArray(x.ex)?x.ex.map(function(e){var z=blankEx();Object.keys(z).forEach(function(k){if(e&&e[k]!==undefined)z[k]=e[k]});return z}):b.ex;
  while(d.ex.length<10)d.ex.push(blankEx());
  d.times=x.times||{};
  d.customFoods=Array.isArray(x.customFoods)?x.customFoods:[];
  d.meals={};['breakfast','lunch','snacks','dinner'].forEach(function(k){d.meals[k]=x.meals&&Array.isArray(x.meals[k])?x.meals[k]:[]});
  d.customDrinks=Array.isArray(x.customDrinks)?x.customDrinks:[];
  return d;
}
function gymDone(d){return !!d&&d.ex.some(function(e){return e.d})}
function hasWeight(d){return !!d&&d.weight!==''&&d.weight!=null&&!isNaN(+d.weight)}
function goals(d){
  if(!d)return [false,false,false,false,false];
  return [d.healthy==='yes',d.fast==='no',gymDone(d),(+d.water||0)>=GOAL_WATER,(+d.steps||0)>=GOAL_STEPS];
}
function score(d){return goals(d).filter(Boolean).length}
function logged(d){return !!d&&!!(d.healthy||d.fast||gymDone(d)||d.water||d.steps||hasWeight(d)||d.mt||d.gt||d.cm||d.cb||(d.meals&&Object.keys(d.meals).some(function(k){return d.meals[k].length})))}

var S={
  view:'today',today:ymd(new Date()),date:ymd(new Date()),days:{},settings:{email:'',name:'',age:'',gender:''},
  dirty:{},ver:{},loaded:false,mode:'pending',deferred:false,mailStep:false,
  mail:{kind:'idle',msg:''},dl:null
};
var store={col:null};

/* ---------- persistence ---------- */
var saveTimer=null,saving=false;
function markDirty(id){S.ver[id]=(S.ver[id]||0)+1;S.dirty[id]=true;scheduleSave()}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}
function localWrite(){
  try{localStorage.setItem('grindlog.v1',JSON.stringify({days:S.days,settings:S.settings}))}catch(e){}
}
async function flush(){
  if(saving)return;
  if(S.mode==='pending')return;
  saving=true;
  try{
    var ids=Object.keys(S.dirty);
    while(ids.length){
      var id=ids.shift(),v=S.ver[id];
      var data=id==='settings'?S.settings:S.days[id];
      if(store.col&&data){
        try{await store.col.doc(id).set(JSON.parse(JSON.stringify(data)))}
        catch(e){toast('Could not save that entry. This page may be open as view-only.');delete S.dirty[id];continue}
      }else if(S.mode==='local'){localWrite()}
      if(S.ver[id]===v)delete S.dirty[id];
      else ids.push(id);
    }
  }finally{saving=false}
}
function edit(date,fn){
  var d=S.days[date]||blankDay(date);
  fn(d);
  d.updatedAt=new Date().toISOString();
  S.days[date]=d;
  markDirty(date);
}
function setStamp(d,key,on){if(on===false)delete d.times[key];else d.times[key]=hm()}

async function initStore(){
  var cl=window.claude;
  try{
    if(cl&&cl.use){
      var db=await cl.use('db'),user=await cl.use('user');
      if(db&&user){
        var id=await user.id();
        if(id){
          store.col=db.collection('data/users/'+id);
          S.mode='cloud';
          store.col.limit(1000).onSnapshot(onSnap,function(){
            S.mode='local';readLocal();render(true);afterLoad();
          });
          flush();
          return;
        }
      }
    }
  }catch(e){}
  S.mode='local';readLocal();render(true);flush();afterLoad();
}
function readLocal(){
  try{
    var raw=localStorage.getItem('grindlog.v1');
    if(raw){
      var o=JSON.parse(raw);
      Object.keys(o.days||{}).forEach(function(k){if(!S.dirty[k])S.days[k]=normDay(o.days[k])});
      if(o.settings&&!S.dirty.settings)S.settings=Object.assign({email:'',name:'',age:'',gender:''},o.settings);
    }
  }catch(e){}
}
var firstSnap=true;
function onSnap(snap){
  var changed=firstSnap,seen={};
  firstSnap=false;
  snap.docs.forEach(function(doc){
    var id=doc.id,data=doc.data();
    if(!data)return;
    if(id==='settings'){
      if(!S.dirty.settings){var ns=Object.assign({email:'',name:'',age:'',gender:''},data);if(!eq(ns,S.settings)){S.settings=ns;changed=true}}
      return;
    }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(id))return;
    seen[id]=true;
    if(S.dirty[id])return;
    var nd=normDay(data);
    if(!eq(S.days[id],nd)){S.days[id]=nd;changed=true}
  });
  Object.keys(S.days).forEach(function(id){
    if(!seen[id]&&!S.dirty[id]){delete S.days[id];changed=true}
  });
  if(changed)render(false);
  afterLoad();
}

/* ---------- stats ---------- */
function dayOf(date){return S.days[date]||null}
function streak(){
  var k=S.today,c=0;
  var t=dayOf(k);
  if(!(logged(t)&&score(t)>=4))k=addDays(k,-1);
  while(c<400){var d=dayOf(k);if(logged(d)&&score(d)>=4){c++;k=addDays(k,-1)}else break}
  return c;
}
function rangeDates(a,b){var o=[],k=a;while(k<=b){o.push(k);k=addDays(k,1)}return o}
function weekDates(anchor){var m=mondayOf(anchor);return rangeDates(m,addDays(m,6))}
function monthDates(anchor){var d=parse(anchor);return rangeDates(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01',d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(daysInMonth(d.getFullYear(),d.getMonth())))}
function stats(dates){
  var all=dates.map(dayOf).filter(Boolean),L=all.filter(logged);
  function sum(f){return L.reduce(function(a,d){return a+(+f(d)||0)},0)}
  var wts=all.filter(hasWeight).map(function(d){return {date:d.date,v:+d.weight}}).sort(function(a,b){return a.date<b.date?-1:1});
  var wAvg=wts.length?wts.reduce(function(a,p){return a+p.v},0)/wts.length:null;
  return {
    n:L.length,
    avg:L.length?L.reduce(function(a,d){return a+score(d)},0)/L.length/5*100:0,
    healthy:L.filter(function(d){return d.healthy==='yes'}).length,
    fastNo:L.filter(function(d){return d.fast==='no'}).length,
    fastYes:L.filter(function(d){return d.fast==='yes'}).length,
    gym:L.filter(gymDone).length,
    water:L.filter(function(d){return d.water>=GOAL_WATER}).length,
    waterTotal:sum(function(d){return d.water})/1000,
    steps:L.filter(function(d){return +d.steps>=GOAL_STEPS}).length,
    stepsTotal:sum(function(d){return d.steps}),
    mt:sum(function(d){return d.mt}),gt:sum(function(d){return d.gt}),
    cm:sum(function(d){return d.cm}),cb:sum(function(d){return d.cb}),
    wts:wts,wAvg:wAvg,wChange:wts.length>1?wts[wts.length-1].v-wts[0].v:null
  };
}

/* ---------- html builders ---------- */
function lvl(d){return logged(d)?'l'+score(d):'lx'}
function lineChart(pts){
  if(pts.length<2)return '<p class="empty">Log your weight on two or more days to see the trend.</p>';
  var W=420,H=200,l=44,r=18,t=24,b=26;
  var xs=pts.map(function(p){return parse(p.date).getTime()}),x0=xs[0],x1=xs[xs.length-1];
  var lo=Math.min.apply(null,pts.map(function(p){return p.v})),hi=Math.max.apply(null,pts.map(function(p){return p.v}));
  if(hi-lo<0.6){var m=(hi+lo)/2;lo=m-.3;hi=m+.3}
  var pd=(hi-lo)*.12;lo-=pd;hi+=pd;
  function X(ms){return l+(x1===x0?0:(ms-x0)/(x1-x0))*(W-l-r)}
  function Y(v){return t+(1-(v-lo)/(hi-lo))*(H-t-b)}
  var g='',ticks=[lo,(lo+hi)/2,hi];
  ticks.forEach(function(v){g+='<line class="cg" x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="ct" x="'+(l-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+v.toFixed(1)+'</text>'});
  var line=pts.map(function(p,i){return X(xs[i]).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' ');
  var area='M'+X(x0).toFixed(1)+','+(H-b)+' L'+line.split(' ').join(' L')+' L'+X(x1).toFixed(1)+','+(H-b)+' Z';
  var dots='';
  if(pts.length<=40)pts.forEach(function(p,i){dots+='<circle class="cp" cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3"/>'});
  var last=pts[pts.length-1],lx=X(x1),ly=Y(last.v);
  dots+='<circle class="cp" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5.5"/>';
  var lab='<text class="cv" x="'+Math.min(lx,W-r-22).toFixed(1)+'" y="'+Math.max(ly-10,12).toFixed(1)+'" text-anchor="middle">'+last.v.toFixed(1)+'</text>';
  var xl='<text class="ct" x="'+l+'" y="'+(H-6)+'">'+fmtShort(pts[0].date)+'</text><text class="ct" x="'+(W-r)+'" y="'+(H-6)+'" text-anchor="end">'+fmtShort(last.date)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight trend in kilograms">'+g+'<path class="ca" d="'+area+'"/><polyline class="cl" points="'+line+'"/>'+dots+lab+xl+'</svg>';
}
function weightPoints(upTo,days){
  var pts=Object.keys(S.days).filter(function(k){return hasWeight(S.days[k])&&k<=upTo}).sort();

  if(days){var from=addDays(upTo,-days+1);pts=pts.filter(function(p){return p.date>=from})}
  return pts;
}

function viewWeek(){
  var dates=weekDates(S.date),st=stats(dates);
  return emptyNote(st)+matrixHtml(dates)+statsHtml(st,'this week')+chartBox(weightPoints(dates[6]).filter(function(p){return p.date>=dates[0]}),'Weight this week');
}
function viewMonth(){
  var dates=monthDates(S.date),st=stats(dates),first=dates[0];
  var cal='<div class="cal">'+DOW.map(function(x){return '<div class="dh">'+x+'</div>'}).join('');
  for(var i=0;i<dowIdx(first);i++)cal+='<div class="cd blank"></div>';
  dates.forEach(function(k){
    var d=S.days[k],future=k>S.today;
    cal+='<button class="cd '+(future?'lx':lvl(d))+(k===S.today?' is-today':'')+'" data-a="goto" data-date="'+k+'" aria-label="'+fmtLong(k)+(logged(d)?', '+score(d)+' of 5 goals':', not logged')+'"><b>'+parse(k).getDate()+'</b><span>'+(logged(d)?score(d)+'/5':'')+'</span></button>';
  });
  cal+='</div><div class="legend"><span>Tap a day to open it.</span><span>Darker yellow means more goals met.</span></div>';
  return emptyNote(st)+cal+'<h3>Daily grid</h3>'+matrixHtml(dates)+statsHtml(st,'this month')+chartBox(weightPoints(dates[dates.length-1]).filter(function(p){return p.date>=dates[0]}),'Weight this month');
}
function viewYear(){
  var y=parse(S.date).getFullYear(),a=y+'-01-01',z=y+'-12-31';
  var all=rangeDates(a,z),st=stats(all);
  var start=mondayOf(a),diffEnd=Math.round((parse(z)-parse(start))/864e5),cols=Math.floor(diffEnd/7)+1;
  var mlab='<div class="heatmonths" style="--cols:'+cols+'">';
  for(var m=0;m<12;m++){var f=y+'-'+pad(m+1)+'-01',idx=Math.floor(Math.round((parse(f)-parse(start))/864e5)/7);mlab+='<span style="grid-column:'+(idx+1)+'">'+MON[m]+'</span>'}
  mlab+='</div>';
  var cells='<div class="heat" role="img" aria-label="Year heatmap of daily goal scores">';
  for(var c=0;c<cols;c++)for(var r=0;r<7;r++){
    var k=addDays(start,c*7+r);
    if(k<a||k>z){cells+='<i class="hc ho"></i>';continue}
    var d=S.days[k];
    cells+='<i class="hc '+(k>S.today?'lx':lvl(d))+'" title="'+fmtLong(k)+(logged(d)?' - '+score(d)+'/5':'')+'"></i>';
  }
  cells+='</div>';
  var tbl='<div class="scroll"><table class="tbl2"><thead><tr><th>Month</th><th>Days</th><th>Avg score</th><th>Healthy</th><th>No fast food</th><th>Gym</th><th>5 L</th><th>11k</th><th>Avg kg</th></tr></thead><tbody>';
  for(var mm=0;mm<12;mm++){
    var ds=monthDates(y+'-'+pad(mm+1)+'-01'),s=stats(ds);
    tbl+='<tr><td>'+MONL[mm]+'</td><td>'+(s.n||'<span class="nil">&middot;</span>')+'</td><td>'+(s.n?Math.round(s.avg)+'%':'<span class="nil">&middot;</span>')+'</td><td>'+s.healthy+'</td><td>'+s.fastNo+'</td><td>'+s.gym+'</td><td>'+s.water+'</td><td>'+s.steps+'</td><td>'+(s.wAvg==null?'<span class="nil">&middot;</span>':s.wAvg.toFixed(1))+'</td></tr>';
  }
  tbl+='</tbody></table></div>';
  return emptyNote(st)+'<div class="heatbox">'+mlab+cells+'</div><div class="legend"><span>Each square is a day. Darker yellow means more goals met.</span></div><h3>By month</h3>'+tbl+statsHtml(st,'this year')+chartBox(weightPoints(z).filter(function(p){return p.date>=a}),'Weight this year');
}

/* ---------- period labels ---------- */
function periodLabel(scope,anchor){
  if(scope==='today')return fmtLong(anchor);
  if(scope==='week'){var w=weekDates(anchor);return 'Week of '+fmtShort(w[0])+' to '+fmtShort(w[6])+' '+parse(w[6]).getFullYear()}
  if(scope==='month'){var d=parse(anchor);return MONL[d.getMonth()]+' '+d.getFullYear()}
  return String(parse(anchor).getFullYear());
}
function reportHtml(){
  var scope=S.view,lbl=periodLabel(scope,S.date);
  var step=S.mailStep;
  return '<section class="card report"><h3>Report <small>'+esc(lbl)+'</small></h3>'
   +'<p class="muted">Get this '+(scope==='today'?'day':scope)+' as a black and yellow PDF, or prepare an email in Gmail.</p>'
   +'<div class="row"><label>Email address for reports<input type="email" id="email" data-f="email" value="'+esc(S.settings.email||'')+'" placeholder="you@gmail.com" autocomplete="email"></label></div>'
   +'<div class="btnrow"><button class="btn primary" data-a="pdf">Download PDF</button><button class="btn" data-a="xlsx">Download Excel backup</button>'
   +(step?'<button class="btn primary" data-a="mailsend" id="mailsend">Send to '+esc(S.settings.email)+'</button><button class="btn ghost" data-a="mailcancel">Cancel</button>':'<button class="btn" data-a="mailstep">Email to Gmail</button>')+'</div>'
   +'<p class="status '+(S.mail.kind==='err'?'err':S.mail.kind==='ok'?'ok':'')+'" id="mailStatus">'+esc(S.mail.msg)+'</p></section>';
}
function navHtml(){
  var v=S.view,lbl=periodLabel(v,S.date),prev,next,nextOff;
  if(v==='today'){prev=addDays(S.date,-1);next=addDays(S.date,1);nextOff=next>S.today}
  else if(v==='week'){prev=addDays(mondayOf(S.date),-7);next=addDays(mondayOf(S.date),7);nextOff=next>S.today}
  else if(v==='month'){var d=parse(S.date);prev=ymd(new Date(d.getFullYear(),d.getMonth()-1,1));next=ymd(new Date(d.getFullYear(),d.getMonth()+1,1));nextOff=next>S.today}
  else{var y=parse(S.date).getFullYear();prev=(y-1)+'-01-01';next=(y+1)+'-01-01';nextOff=next>S.today}
  return '<div class="pnav"><button class="sq" data-a="nav" data-to="'+prev+'" aria-label="Previous">&lsaquo;</button><div class="lbl">'+esc(lbl)+'</div><button class="sq" data-a="nav" data-to="'+next+'" aria-label="Next"'+(nextOff?' disabled':'')+'>&rsaquo;</button>'
   +(v==='today'?'<input type="date" id="jump" value="'+S.date+'" max="'+S.today+'" aria-label="Jump to a date">':'')
   +(S.date!==S.today?'<button class="btn" data-a="nav" data-to="'+S.today+'">Today</button>':'')+'</div>';
}
function footHtml(){
  var hasSample=Object.keys(S.days).some(function(k){return S.days[k].sample});
  var any=Object.keys(S.days).some(function(k){return logged(S.days[k])});
  var st=S.mode==='cloud'?'Saved to your account':S.mode==='local'?'Saved on this device only':'Connecting to storage';
  return '<div class="foot"><span>'+st+'. Each entry records its date and time.'+(S.settings.lastBackup?' Last auto backup: data up to '+fmtShort(S.settings.lastBackup)+'.':'')+'</span><span>'
    +(hasSample?'<button class="link" data-a="clearsample">Remove sample data</button>':(!any?'<button class="link" data-a="sample">Load 14 days of sample data</button>':''))+'</span></div>';
}
function clockHtml(){
  var n=new Date();
  return '<span id="clockDate">'+fmtLong(ymd(n))+'</span><b id="clockTime">'+pad(n.getHours())+':'+pad(n.getMinutes())+'</b>';
}

function isTyping(){
  var a=document.activeElement;
  return !!a&&app.contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.type!=='date';
}
function liveUpdate(){
  if(S.view!=='today')return;
  var d=S.days[S.date]||blankDay(S.date);
  var h=document.getElementById('hero');if(h)h.innerHTML=heroHtml(S.date,d);
  var s=document.getElementById('stepsMeta');if(s)s.innerHTML=stepsMetaHtml(d);
  var w=document.getElementById('wMeta');if(w)w.innerHTML=wMetaHtml(S.date,d);
  var c=document.getElementById('wChart');if(c)c.innerHTML=lineChart(weightPoints(S.date,30));
  var g=document.getElementById('gymCount');if(g)g.textContent=gymCountHtml(d);
}
var toastTimer=null;
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='mealText'){e.preventDefault();var b=document.querySelector('[data-a="mealadd"]');if(b)b.click()}});
function toast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.className='show';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className=''},3800);
}

/* ---------- actions ---------- */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  act(b.dataset.a,b.dataset);
});
app.addEventListener('input',function(e){
  var t=e.target,f=t.dataset.f;
  if(!f)return;
  if(f==='email'){S.settings.email=t.value.trim();markDirty('settings');return}
  if(f==='pname'){S.settings.name=t.value.slice(0,60);markDirty('settings');return}
  if(f==='page'){var an=t.value.replace(/\D/g,'').slice(0,3);if(an!==''&&+an>120)an='120';if(an!==t.value)t.value=an;S.settings.age=an;markDirty('settings');return}
  if(f==='pgender'){S.settings.gender=t.value;markDirty('settings');return}
  var v=t.value;
  edit(S.date,function(d){
    if(f==='ex'){d.ex[+t.dataset.i][t.dataset.k]=v;setStamp(d,'gym')}
    else if(f==='steps'){var n=v.replace(/\D/g,'');d.steps=n===''?'':Math.min(+n,200000);setStamp(d,'steps')}
    else if(f==='weight'){var x=parseFloat(v.replace(',','.'));d.weight=isNaN(x)?'':x;setStamp(d,'weight')}
    else if(f==='note'){d.note=v;setStamp(d,'note')}
  });
  liveUpdate();
});
app.addEventListener('change',function(e){
  if(e.target.id==='jump'&&e.target.value){S.date=e.target.value>S.today?S.today:e.target.value;render(true)}
});
app.addEventListener('focusout',function(){
  if(!S.deferred)return;
  setTimeout(function(){if(S.deferred&&!isTyping())render(true)},0);
});

function act(a,ds){
  switch(a){
    case 'tab':S.view=ds.v;S.mailStep=false;S.mail={kind:'idle',msg:''};render(true);break;
    case 'nav':S.date=ds.to>S.today&&S.view==='today'?S.today:ds.to;S.mailStep=false;render(true);break;
    case 'goto':S.view='today';S.date=ds.date;window.scrollTo(0,0);render(true);break;
    case 'yn':
      edit(S.date,function(d){var cur=d[ds.f];d[ds.f]=cur===ds.v?null:ds.v;setStamp(d,ds.f,d[ds.f]!==null)});
      render(true);break;
    case 'water':
      edit(S.date,function(d){d.water=clamp((+d.water||0)+(+ds.n),0,10000);setStamp(d,'water')});render(true);break;
    case 'steps':
      edit(S.date,function(d){d.steps=clamp((+d.steps||0)+(+ds.n),0,200000);setStamp(d,'steps')});render(true);break;
    case 'cnt':
      edit(S.date,function(d){d[ds.f]=clamp((+d[ds.f]||0)+(+ds.d),0,99);setStamp(d,ds.f)});render(true);break;
    case 'mealpick': S.meal=ds.m;render(true);setTimeout(function(){var e=document.getElementById('mealText');if(e)e.focus()},0);break;
    case 'mealadd': {var mi=document.getElementById('mealText'),mt=(mi&&mi.value||'').trim(),mk=S.meal||'breakfast';if(!mt){toast('Type what you ate first.');break}edit(S.date,function(d){d.meals=d.meals||{};d.meals[mk]=d.meals[mk]||[];d.meals[mk].push(mt);setStamp(d,'meal-'+mk)});render(true);setTimeout(function(){var e=document.getElementById('mealText');if(e)e.focus()},0);break}
    case 'mealremove': edit(S.date,function(d){d.meals[ds.m].splice(+ds.i,1)});render(true);break;
    case 'foodadd': {var fi=document.getElementById('customFoodName'),fn=(fi&&fi.value||'').trim();if(!fn){toast('Enter a food item name first.');break}edit(S.date,function(d){d.customFoods=d.customFoods||[];d.customFoods.push({name:fn,eaten:false})});render(true);break}
    case 'foodtoggle': edit(S.date,function(d){d.customFoods[+ds.i].eaten=!d.customFoods[+ds.i].eaten;setStamp(d,'food-'+ds.i)});render(true);break;
    case 'foodremove': edit(S.date,function(d){d.customFoods.splice(+ds.i,1)});render(true);break;
    case 'drinkadd': {var di=document.getElementById('customDrinkName'),dn=(di&&di.value||'').trim();if(!dn){toast('Enter a drink item name first.');break}edit(S.date,function(d){d.customDrinks=d.customDrinks||[];d.customDrinks.push({name:dn,count:0})});render(true);break}
    case 'customdrink': edit(S.date,function(d){var x=d.customDrinks[+ds.i];x.count=clamp((+x.count||0)+(+ds.d),0,99);setStamp(d,'customdrink-'+ds.i)});render(true);break;
    case 'drinkremove': edit(S.date,function(d){d.customDrinks.splice(+ds.i,1)});render(true);break;
    case 'timeradd': gymTimerSeconds=Math.min(5999,gymTimerSeconds+(+ds.sec||0));updateGymTimer();break;
    case 'timerstart':
      if(gymTimerSeconds<=0){toast('Add seconds or minutes first.');break}
      if(!gymTimerRunning){gymTimerRunning=true;clearInterval(gymTimerInterval);gymTimerInterval=setInterval(function(){if(gymTimerSeconds>0)gymTimerSeconds--;updateGymTimer();if(gymTimerSeconds<=0){clearInterval(gymTimerInterval);gymTimerInterval=null;gymTimerRunning=false;toast('Rest timer finished!');var st=document.querySelector('.gymtimer [data-a=timerstart]');if(st)st.textContent='Start'}},1000);var sb=document.querySelector('.gymtimer [data-a=timerstart]');if(sb)sb.textContent='Running…'}break;
    case 'timerpause': gymTimerRunning=false;clearInterval(gymTimerInterval);gymTimerInterval=null;var pb=document.querySelector('.gymtimer [data-a=timerstart]');if(pb)pb.textContent='Start';break;
    case 'timerreset': gymTimerRunning=false;clearInterval(gymTimerInterval);gymTimerInterval=null;gymTimerSeconds=0;updateGymTimer();var rb=document.querySelector('.gymtimer [data-a=timerstart]');if(rb)rb.textContent='Start';break;
    case 'exdone':
      edit(S.date,function(d){var e=d.ex[+ds.i];e.d=!e.d;setStamp(d,'gym')});render(true);break;
    case 'exadd':
      edit(S.date,function(d){d.ex.push(blankEx())});render(true);
      setTimeout(function(){var rows=app.querySelectorAll('.exrow input[data-k="n"]');if(rows.length)rows[rows.length-1].focus()},0);break;
    case 'pdf':doPdf();break;
    case 'xlsx':if(downloadBackup(S.today,false))toast('Excel backup downloaded.');break;
    case 'mailstep':
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.settings.email||'')){
        S.mail={kind:'err',msg:'Enter your email address first.'};render(true);var em=document.getElementById('email');if(em)em.focus();break;
      }
      S.mailStep=true;S.mail={kind:'idle',msg:''};render(true);break;
    case 'mailcancel':S.mailStep=false;render(true);break;
    case 'mailsend':doMail();break;
    case 'sample':loadSample();break;
    case 'clearsample':clearSample();break;
  }
}

/* ---------- sample data ---------- */
function loadSample(){
  var seed=7;function r(){seed=(seed*9301+49297)%233280;return seed/233280}
  var names=['Bench press','Squat','Deadlift','Overhead press','Barbell row','Pull-up'];
  for(var k=14;k>=1;k--){
    var date=addDays(S.today,-k);
    if(S.days[date])continue;
    var d=blankDay(date);d.sample=true;
    d.healthy=r()<.75?'yes':'no';d.fast=r()<.3?'yes':'no';
    if(r()<.6){var n=4+Math.floor(r()*3);for(var i=0;i<n;i++)d.ex[i]={n:names[i%names.length],s:'4',r:String(8+Math.floor(r()*5)),w:String(20+Math.floor(r()*8)*5),d:true}}
    d.water=Math.round((2500+r()*3000)/250)*250;d.steps=Math.round(6000+r()*7000);
    d.weight=Math.round((78.4-k*0.05+(r()-.5)*.4)*10)/10;
    d.mt=Math.floor(r()*3);d.gt=Math.floor(r()*3);d.cm=Math.floor(r()*3);d.cb=Math.floor(r()*2);
    d.updatedAt=new Date().toISOString();
    S.days[date]=d;markDirty(date);
  }
  render(true);toast('Sample data added. Remove it any time from the footer.');
}
async function clearSample(){
  var ids=Object.keys(S.days).filter(function(k){return S.days[k].sample});
  ids.forEach(function(k){delete S.days[k];delete S.dirty[k]});
  if(store.col){for(var i=0;i<ids.length;i++){try{await store.col.doc(ids[i]).delete()}catch(e){}}}
  else if(S.mode==='local')localWrite();
  render(true);toast('Sample data removed.');
}

function backupTables(upTo){
  var keys=Object.keys(S.days).filter(function(k){return k<=upTo&&logged(S.days[k])}).sort();
  function yn(v){return v==='yes'?'Yes':v==='no'?'No':''}
  var sum=[['Date','Day','Healthy food','Fast food','Gym done','Water (L)','Steps','Weight (kg)','Milk tea','Green tea','Coffee with milk','BLACK COFFEE','Other drinks','Goals met (of 5)','Notes','Last updated']];
  var gym=[['Date','#','Exercise','Sets','Reps','Kg','Min','Sec','Done']];
  var meals=[['Date','Breakfast','Lunch','Snacks','Dinner']];
  keys.forEach(function(k){
    var d=S.days[k];

function buildBackupWorkbook(upTo){
  if(!window.XLSX)return null;
  var t=backupTables(upTo);
  if(!t.keys.length)return null;
  var wb=XLSX.utils.book_new();
  function add(name,rows,widths){
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=widths.map(function(w){return {wch:w}});
    XLSX.utils.book_append_sheet(wb,ws,name);
  }
  add('Daily summary',t.sum,[12,6,13,11,10,10,9,12,9,10,16,14,22,15,40,24]);
  add('Gym log',t.gym,[12,5,22,6,6,7,6,6,7]);
  add('Meals',t.meals,[12,30,30,30,30]);
  add('PDF log',t.pdf,[18,12,34,40,18,14]);
  var prof=S.settings||{};
  add('Profile',[['Name',prof.name||''],['Age',prof.age||''],['Gender',prof.gender||''],['Email',prof.email||''],['Backup includes data up to',upTo],['Created',new Date().toISOString()]],[28,40]);
  return wb;
}
function downloadBackup(upTo,silent){
  var url=null,link=null;
  try{
    var wb=buildBackupWorkbook(upTo);
    if(!wb){if(!silent)toast(window.XLSX?'Nothing to back up yet.':'The Excel tool did not load. Check your connection and try again.');return false}
    var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    url=URL.createObjectURL(blob);
    link=document.createElement('a');link.href=url;link.download='lifeline-fitness-backup-'+upTo+'.xlsx';link.style.display='none';
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},5000);
    return true;
  }catch(e){console.error('Backup failed:',e);if(!silent)toast('Could not create the Excel backup.');return false}
}
function checkRollover(){
  if(!S.loaded)return;
  var y=addDays(S.today,-1);
  if(S.settings.lastBackup!==y&&!backupTried[y]){
    backupTried[y]=true;
    var has=Object.keys(S.days).some(function(k){return k<=y&&logged(S.days[k])});
    var okx=true;
    if(has){
      okx=downloadBackup(y,true);
      toast(okx?'New day started. Excel backup of all data up to '+fmtShort(y)+' downloaded.':'Automatic Excel backup could not run. Use "Download Excel backup" in the Report card.');
    }
    if(okx){S.settings.lastBackup=y;markDirty('settings')}
  }
}

    table([{h:'Month',w:40},{h:'Milk tea',w:30,a:'r'},{h:'Green tea',w:30,a:'r'},{h:'Coffee + milk',w:36,a:'r'},{h:'BLACK COFFEE',w:40,a:'r'}],ms.map(function(o){return [o.name,String(o.s.mt),String(o.s.gt),String(o.s.cm),String(o.s.cb)]}));

    table([{h:'Month',w:40},{h:'Gym days',w:45,a:'r'},{h:'Exercises logged',w:50,a:'r'}],ms.map(function(o){return [o.name,String(o.s.gym),String(exCount(o.dates))]}));
    secBar('9. Goals scorecard');
    table([{h:'Month',w:40},{h:'Days logged',w:40,a:'r'},{h:'Average score',w:40,a:'r'}],ms.map(function(o){return [o.name,String(o.s.n),o.s.n?Math.round(o.s.avg)+'%':'-']}));
  }else{
    var dates=scope==='week'?weekDates(anchor):monthDates(anchor);
    function lbl(k){return DOW[dowIdx(k)]+' '+fmtShort(k)}
    function rowsOf(f){return dates.map(function(k){var d=S.days[k];return [lbl(k)].concat(f(d||null))})}
    secBar('3. Food');
    table([{h:'Date',w:40},{h:'Healthy food',w:46,a:'c'},{h:'Fast food',w:46,a:'c'}],rowsOf(function(d){return [d&&d.healthy?yn(d.healthy):'-',d&&d.fast?yn(d.fast):'-']}));
    mealsRange(dates,lbl);
    secBar('4. Water');
    table([{h:'Date',w:40},{h:'Water (L)',w:46,a:'r'},{h:'5 L goal',w:46,a:'c'}],rowsOf(function(d){var w=d?+d.water||0:0;return [w?trim2(w/1000):'-',w?(w>=GOAL_WATER?'Met':'Not met'):'-']}));
    secBar('5. Steps');
    table([{h:'Date',w:40},{h:'Steps',w:46,a:'r'},{h:'11,000 goal',w:46,a:'c'}],rowsOf(function(d){var s=d?+d.steps||0:0;return [s?s.toLocaleString('en-US'):'-',s?(s>=GOAL_STEPS?'Met':'Not met'):'-']}));
    secBar('6. Weight');
    table([{h:'Date',w:40},{h:'Weight (kg)',w:46,a:'r'}],rowsOf(function(d){return [hasWeight(d)?(+d.weight).toFixed(1):'-']}));
    secBar('7. Tea & coffee');
    table([{h:'Date',w:36},{h:'Milk tea',w:26,a:'r'},{h:'Green tea',w:26,a:'r'},{h:'Coffee + milk',w:32,a:'r'},{h:'BLACK COFFEE',w:34,a:'r'},{h:'Other',w:28}],rowsOf(function(d){return [d&&d.mt?String(d.mt):'-',d&&d.gt?String(d.gt):'-',d&&d.cm?String(d.cm):'-',d&&d.cb?String(d.cb):'-',d&&d.customDrinks&&d.customDrinks.length?d.customDrinks.map(function(x){return x.name+' '+(x.count||0)}).join(', ').slice(0,18):'-']}));
    secBar('8. Exercise / gym log');
    var anyEx=false;
    dates.forEach(function(k){
      var ex=exOf(S.days[k]);if(!ex.length)return;
      anyEx=true;
      if(y>262){doc.addPage();y=16}
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(20,20,18);doc.text(fmtLong(k),M,y);y+=4;
      table(exCols,ex.map(function(e,i){return [String(i+1),e.n||'-',e.s||'-',e.r||'-',e.w||'-',e.min||'-',e.sec||'-',e.d?'Yes':'No']}));
    });
    if(!anyEx)para('No exercises logged in this period.');
    secBar('9. Notes');
    var anyN=false;
    dates.forEach(function(k){var d=S.days[k];if(d&&d.note){anyN=true;para(lbl(k)+': '+d.note)}});
    if(!anyN)para('No notes in this period.');
    secBar('10. Goals scorecard');
    table([{h:'Date',w:40},{h:'Goals met',w:46,a:'r'},{h:'Score',w:46,a:'r'}],rowsOf(function(d){return logged(d)?[score(d)+' of 5',Math.round(score(d)/5*100)+'%']:['-','-']}));
  }
  /* PDF download log inside the report */
  secBar((scope==='year'?10:11)+'. PDF download log');
  var plog=(S.settings.pdfLog||[]).slice().reverse().slice(0,25);
  var plrows=[[stampFull(now.toISOString()),scope==='today'?'Day':scope[0].toUpperCase()+scope.slice(1),period,'This PDF']].concat(plog.map(function(e){return [stampFull(e.at),e.scope,e.period,e.src]}));
  table([{h:'Downloaded at',w:38},{h:'Type',w:20},{h:'Period',w:66},{h:'Source',w:30}],plrows);
  para('Total PDF downloads recorded before this one: '+(S.settings.pdfLog||[]).length+'.');

  /* Previous day vs today chart (last section) */
  var cd=scope==='today'?anchor:S.today,pd=addDays(cd,-1);
  var dP=S.days[pd]||blankDay(pd),dT=S.days[cd]||blankDay(cd);
  function exN(d){return d.ex.filter(function(e){return e.d}).length}
  function fmtN(v){return Math.round(v).toLocaleString('en-US')}
  var cmp=[['Goals met (of 5)',score(dP),score(dT),5,function(v){return String(v)}],
    ['Water (L)',(+dP.water||0)/1000,(+dT.water||0)/1000,5,trim2],
    ['Steps',+dP.steps||0,+dT.steps||0,GOAL_STEPS,fmtN],
    ['Gym exercises done',exN(dP),exN(dT),0,function(v){return String(v)}],
    ['Milk tea (cups)',+dP.mt||0,+dT.mt||0,0,function(v){return String(v)}],
    ['Green tea (cups)',+dP.gt||0,+dT.gt||0,0,function(v){return String(v)}],
    ['Coffee with milk (cups)',+dP.cm||0,+dT.cm||0,0,function(v){return String(v)}],
    ['BLACK COFFEE (cups)',+dP.cb||0,+dT.cb||0,0,function(v){return String(v)}]];
  if(y>130){doc.addPage();y=16}
  secBar((scope==='year'?11:12)+'. Previous day vs today');
  var pLbl='Previous day ('+DOW[dowIdx(pd)]+' '+fmtShort(pd)+')',tLbl=(cd===S.today?'Today':'Selected day')+' ('+DOW[dowIdx(cd)]+' '+fmtShort(cd)+')';
  doc.setFillColor(110,108,98);doc.rect(M,y,4,4,'F');
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(20,20,18);doc.text(pLbl,M+6,y+3.4);
  doc.setFillColor(255,212,0);doc.setDrawColor(20,20,18);doc.setLineWidth(0.2);doc.rect(M+70,y,4,4,'FD');
  doc.text(tLbl,M+76,y+3.4);
  y+=9;
  var bx=M+46,bw=84;
  cmp.forEach(function(c){
    var mx=Math.max(c[3],c[1],c[2],1);
    if(y>270){doc.addPage();y=16}
    doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(20,20,18);doc.text(c[0],M,y+5.5);
    doc.setDrawColor(200,198,188);doc.setLineWidth(0.2);doc.line(bx,y-1,bx,y+10);
    var l1=c[1]/mx*bw,l2=c[2]/mx*bw;
    doc.setFillColor(110,108,98);if(l1>0)doc.rect(bx,y,l1,4,'F');
    doc.setFillColor(255,212,0);doc.setDrawColor(20,20,18);doc.setLineWidth(0.2);if(l2>0)doc.rect(bx,y+5,l2,4,'FD');
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(20,20,18);
    doc.text(c[4](c[1]),bx+l1+1.5,y+3.2);doc.text(c[4](c[2]),bx+l2+1.5,y+8.2);
    var df=c[2]-c[1],dt=df===0?'No change':(df>0?'+':'-')+c[4](Math.abs(df));
    doc.setFont('helvetica','bold');doc.text(dt,W-M,y+5.5,{align:'right'});
    y+=13;
  });
  var wP=hasWeight(dP)?(+dP.weight).toFixed(1)+' kg':'not logged',wT=hasWeight(dT)?(+dT.weight).toFixed(1)+' kg':'not logged';
  var wd=hasWeight(dP)&&hasWeight(dT)?' (change '+((+dT.weight-+dP.weight)>0?'+':'')+(+dT.weight-+dP.weight).toFixed(1)+' kg)':'';
  y+=1;para('Weight: previous day '+wP+', '+(cd===S.today?'today ':'selected day ')+wT+wd+'. Bars are scaled to the daily goal where one exists.');
  var pages=doc.getNumberOfPages();
  for(var p=1;p<=pages;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,120,110);doc.text('Page '+p+' of '+pages,W-M,291,{align:'right'})}
  return doc;
}
function fileName(scope,anchor){
  var tag=scope==='today'?anchor:scope==='week'?mondayOf(anchor):scope==='month'?anchor.slice(0,7):anchor.slice(0,4);
  return 'lifeline-fitness-'+(scope==='today'?'day':scope)+'-'+tag+'.pdf';
}
async function doPdf(){
  var url=null,link=null;
  try{
    // Use the browser's native download instead of a host-specific download API.
    var doc=makePdf(S.view,S.date);
    var blob=doc.output('blob');
    url=URL.createObjectURL(blob);
    link=document.createElement('a');
    link.href=url;
    link.download=fileName(S.view,S.date);
    link.style.display='none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    logPdf(S.view,S.date,'Download');
    toast('PDF download started.');
  }catch(e){
    console.error('PDF download failed:',e);
    toast(e&&e.message?e.message:'Could not create the PDF. Check your internet connection and try again.');
  }finally{
    if(link&&link.parentNode)link.remove();
    if(url)setTimeout(function(){URL.revokeObjectURL(url)},2000);
  }
}
function b64(buf){
  var b=new Uint8Array(buf),s='';
  for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(s);
}
function exerciseEmailLines(scope,anchor){
  var dates=scope==='today'?[anchor]:scope==='week'?weekDates(anchor):scope==='month'?monthDates(anchor):rangeDates(parse(anchor).getFullYear()+'-01-01',parse(anchor).getFullYear()+'-12-31');
  var lines=['GYM WORKOUT / EXERCISE DETAILS'];
  var total=0;
  dates.forEach(function(date){
    var d=S.days[date];
    var ex=d&&Array.isArray(d.ex)?d.ex.filter(function(e){return e&&(e.n||e.s||e.r||e.w||e.min||e.sec||e.d)}):[];
    if(!ex.length)return;
    total+=ex.length;
    if(scope!=='today')lines.push('',fmtLong(date));
    ex.forEach(function(e,i){
      lines.push((i+1)+'. '+(e.n||'Exercise')+' | Sets: '+(e.s||'-')+' | Reps: '+(e.r||'-')+' | Weight: '+(e.w?e.w+' kg':'-')+' | Time: '+((e.min||'0')+' min '+(e.sec||'0')+' sec')+' | Status: '+(e.d?'COMPLETED':'NOT COMPLETED'));
    });
  });
  if(!total)lines.push('No exercises logged for this period.');
  else lines.push('Total exercise entries: '+total);
  if(scope==='today'){
    var d=S.days[anchor];
    if(d&&d.note)lines.push('', 'WORKOUT NOTES', d.note);
  }
  return lines;
}
function setMail(kind,msg){
  S.mail={kind:kind,msg:msg};
  var el=document.getElementById('mailStatus');
  if(el){el.textContent=msg;el.className='status '+(kind==='err'?'err':kind==='ok'?'ok':'')}
}
async function doMail(){
  var btn=document.getElementById('mailsend');if(btn)btn.disabled=true;
  try{
    var scope=S.view,anchor=S.date,label=periodLabel(scope,anchor);
    var subject='Lifeline Fitness report: '+label;
    var body='HELLO,\n\nPlease find '+(S.settings.name?S.settings.name+'\'s':'my')+' Lifeline Fitness report for '+label+'.\n\nDAILY HEALTH SUMMARY\n---------------------\n'+summaryLines(scope,anchor).join('\n')+'\n\n'+exerciseEmailLines(scope,anchor).join('\n')+'\n\nPDF REPORT\n-----------\nI will attach the PDF report to this email.\n\nRegards';
    var mcp=null;
    try{mcp=window.claude&&window.claude.use?await window.claude.use('mcp'):null}catch(ignore){mcp=null}
    if(mcp){
      try{
        var doc=makePdf(scope,anchor);
        setMail('idle','Sending report...');
        await mcp.callTool('Gmail','send_message',{
          to:[S.settings.email],subject:subject,body:body,
          attachments:[{filename:fileName(scope,anchor),mimeType:'application/pdf',content:b64(doc.output('arraybuffer'))}]
        });
        logPdf(scope,anchor,'Email sent');S.mailStep=false;render(true);setMail('ok','Email sent to '+S.settings.email+'.');return;
      }catch(toolError){console.warn('Connected Gmail send failed; opening email draft instead.',toolError)}
    }
    // Browser security does not let a standalone HTML page attach a local PDF to a Gmail draft.
    // Create and download the PDF automatically, then open a prefilled Gmail draft.
    var docFallback=makePdf(scope,anchor);
    var pdfBlob=docFallback.output('blob');
    var pdfUrl=URL.createObjectURL(pdfBlob);
    var pdfLink=document.createElement('a');
    pdfLink.href=pdfUrl;
    pdfLink.download=fileName(scope,anchor);
    pdfLink.style.display='none';
    document.body.appendChild(pdfLink);
    pdfLink.click();
    pdfLink.remove();
    setTimeout(function(){URL.revokeObjectURL(pdfUrl)},10000);
    logPdf(scope,anchor,'Email draft');
    var gmailUrl='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(S.settings.email)+'&su='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
    var win=window.open(gmailUrl,'_blank');
    if(!win){window.location.href='mailto:'+encodeURIComponent(S.settings.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
    setMail('ok','PDF downloaded and Gmail draft opened. In Gmail, click the paperclip (Attach files), choose the downloaded '+fileName(scope,anchor)+' PDF, then click Send.');
    if(btn)btn.disabled=false;
  }catch(e){
    console.error('Email draft error:',e);
    setMail('err',(e&&e.message)||'Could not open the email draft. Allow pop-ups and try again.');
    var b2=document.getElementById('mailsend');if(b2)b2.disabled=false;
  }
}

/* ---------- boot ---------- */
render(true);
function dayTick(){
  var n=new Date(),t=ymd(n);
  var ct=document.getElementById('clockTime'),cd=document.getElementById('clockDate');
  if(ct)ct.textContent=pad(n.getHours())+':'+pad(n.getMinutes());
  if(cd)cd.textContent=fmtLong(t);
  if(t!==S.today){
    var follow=S.date===S.today;
    S.today=t;if(follow)S.date=t;
    /* new day: reset selections, timer and open states so the form starts clean */
    S.meal='breakfast';S.mailStep=false;S.mail={kind:'idle',msg:''};
    clearInterval(gymTimerInterval);gymTimerInterval=null;gymTimerRunning=false;gymTimerSeconds=0;
    checkRollover();
    if(document.activeElement&&document.activeElement.blur&&isTyping())document.activeElement.blur();
    render(true);
  }
}
setInterval(dayTick,20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)dayTick()});
initStore();
})();
